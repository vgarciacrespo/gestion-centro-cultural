{% extends "app_actividades/base.html" %}
{% block title %}Centro Cultural Municipal{% endblock %}
{% block content %}

<div style="
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 80vh;
    text-align: center;
    gap: 20px;
">
    <div style="
        width: 90px; height: 90px; border-radius: 24px;
        background: linear-gradient(135deg, #6c63ff, #ff6584);
        display: flex; align-items: center; justify-content: center;
        font-size: 48px;
        box-shadow: 0 8px 32px rgba(108,99,255,.35);
    ">🎭</div>

    <h1 style="font-size: 32px; font-weight: 700;">Centro Cultural Municipal</h1>

    <p style="color: var(--text-muted); font-size: 16px; max-width: 420px; line-height: 1.6;">
        Plataforma de gestión de actividades, inscripciones, monitores y salas.
    </p>
</div>

{% endblock %}
