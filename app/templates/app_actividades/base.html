<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Plataforma de gestión de actividades del Centro Cultural Municipal">
    <title>{% block title %}Centro Cultural{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0f1117;
            --surface: #1a1d2e;
            --surface2: #22263a;
            --accent: #6c63ff;
            --accent2: #ff6584;
            --text: #e2e8f0;
            --text-muted: #8892a4;
            --border: #2d3352;
            --success: #34d399;
            --danger: #f87171;
            --warning: #fbbf24;
            --radius: 12px;
            --radius-sm: 8px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
        }

        /* ── SIDEBAR ── */
        .sidebar {
            width: 240px;
            min-height: 100vh;
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 24px 16px;
            position: fixed;
            top: 0; left: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 100;
        }

        .sidebar-brand {
            padding: 8px 12px 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-brand .logo {
            width: 36px; height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
        }

        .sidebar-brand span {
            font-weight: 700;
            font-size: 15px;
            color: var(--text);
            line-height: 1.2;
        }

        .sidebar-section {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--text-muted);
            text-transform: uppercase;
            padding: 12px 12px 4px;
        }

        .sidebar a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all .2s;
        }

        .sidebar a:hover, .sidebar a.active {
            background: var(--surface2);
            color: var(--text);
        }

        .sidebar a.active {
            color: var(--accent);
            background: rgba(108, 99, 255, .12);
        }

        .sidebar a .icon { font-size: 16px; width: 20px; text-align: center; }

        /* ── MESSAGES ── */
        .msg-success { padding: 12px 18px; background: rgba(52,211,153,.1); border: 1px solid rgba(52,211,153,.3); color: var(--success); border-radius: var(--radius-sm); margin-bottom: 16px; font-size: 14px; }
        .msg-error   { padding: 12px 18px; background: rgba(248,113,113,.1); border: 1px solid rgba(248,113,113,.3); color: var(--danger);  border-radius: var(--radius-sm); margin-bottom: 16px; font-size: 14px; }

        /* ── MAIN ── */
        .main {
            margin-left: 240px;
            flex: 1;
            padding: 32px;
            max-width: calc(100vw - 240px);
        }

        /* ── TOPBAR ── */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
        }

        .topbar h1 {
            font-size: 22px;
            font-weight: 700;
        }

        .topbar .breadcrumb {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* ── BUTTON ── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 18px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            text-decoration: none;
            transition: all .2s;
        }

        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: #5a53e0; transform: translateY(-1px); }
        .btn-danger { background: rgba(248,113,113,.15); color: var(--danger); border: 1px solid rgba(248,113,113,.3); }
        .btn-danger:hover { background: var(--danger); color: #fff; }
        .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--border); }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn-success { background: rgba(52,211,153,.15); color: var(--success); border: 1px solid rgba(52,211,153,.3); }
        .btn-success:hover { background: var(--success); color: #0f1117; }

        /* ── CARD ── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            transition: border-color .2s;
        }

        .card:hover { border-color: var(--accent); }

        /* ── TABLE ── */
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th {
            text-align: left;
            padding: 12px 16px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .8px;
            text-transform: uppercase;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
        }
        td {
            padding: 14px 16px;
            font-size: 14px;
            border-bottom: 1px solid rgba(45,51,82,.5);
        }
        tr:hover td { background: rgba(108,99,255,.04); }
        tr:last-child td { border-bottom: none; }

        /* ── BADGE ── */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .badge-purple { background: rgba(108,99,255,.2); color: var(--accent); }
        .badge-green  { background: rgba(52,211,153,.2); color: var(--success); }
        .badge-red    { background: rgba(248,113,113,.2); color: var(--danger); }
        .badge-yellow { background: rgba(251,191,36,.2); color: var(--warning); }

        /* ── FORM ── */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text-muted); }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            padding: 10px 14px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color .2s;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: var(--accent);
        }
        .form-group select[multiple] { height: 120px; }
        .form-group textarea { min-height: 90px; resize: vertical; }
        .form-group .errorlist { color: var(--danger); font-size: 12px; margin-top: 4px; list-style: none; }

        /* ── FILTER BAR ── */
        .filter-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: flex-end;
            margin-bottom: 24px;
        }
        .filter-bar .form-group { margin-bottom: 0; }

        /* ── DETAIL GRID ── */
        .detail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .detail-item label { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--text-muted); font-weight: 600; }
        .detail-item p { margin-top: 4px; font-size: 15px; font-weight: 500; }

        /* ── STATS ── */
        .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; margin-bottom: 28px; }
        .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
        .stat-card .stat-num { font-size: 28px; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .stat-card .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

        /* ── EMPTY STATE ── */
        .empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .empty .empty-icon { font-size: 48px; display: block; margin-bottom: 16px; }

        /* ── ACTIONS ── */
        .actions { display: flex; gap: 8px; }

        /* ── ALERT ── */
        .alert { padding: 14px 18px; border-radius: var(--radius-sm); margin-bottom: 20px; font-size: 14px; }
        .alert-danger { background: rgba(248,113,113,.1); border: 1px solid rgba(248,113,113,.3); color: var(--danger); }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .main { margin-left: 0; max-width: 100vw; padding: 16px; }
        }
    </style>
</head>
<body>

<nav class="sidebar">
    <div class="sidebar-brand">
        <a href="{% url 'home' %}" style="display:flex;align-items:center;gap:10px;text-decoration:none">
            <div class="logo">🎭</div>
            <span>Centro<br>Cultural</span>
        </a>
    </div>

    <a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">
        <span class="icon">🏠</span> Inicio
    </a>

    <div class="sidebar-section">General</div>
    <a href="{% url 'lista_actividades' %}" class="{% if request.resolver_match.url_name == 'lista_actividades' or request.resolver_match.url_name == 'detalle_actividad' %}active{% endif %}">
        <span class="icon">🎨</span> Actividades
    </a>
    <a href="{% url 'lista_usuarios' %}" class="{% if 'usuario' in request.resolver_match.url_name %}active{% endif %}">
        <span class="icon">👥</span> Usuarios Inscritos
    </a>

    <div class="sidebar-section">Gestión</div>
    <a href="{% url 'lista_monitores' %}" class="{% if 'monitor' in request.resolver_match.url_name %}active{% endif %}">
        <span class="icon">🧑‍🏫</span> Monitores
    </a>
    <a href="{% url 'lista_salas' %}" class="{% if 'sala' in request.resolver_match.url_name %}active{% endif %}">
        <span class="icon">🏛️</span> Salas
    </a>
</nav>

<main class="main">
    {% if messages %}
        {% for msg in messages %}
        <div class="{% if msg.tags == 'error' %}msg-error{% else %}msg-success{% endif %}">{{ msg }}</div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</main>

</body>
</html>
